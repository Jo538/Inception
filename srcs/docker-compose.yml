services:
  nginx:
    build: requirements/nginx
    image: nginx
    container_name: container_nginx
    ports:
      - "443:443"
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
  wordpress:
    build: requirements/wordpress
    image: wordpress
    container_name: container_wordpress
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    environment:
      - WP_URL=${WP_URL}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_OTHER_USER=${WP_OTHER_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    build: requirements/mariadb
    image: mariadb
    container_name: container_mariadb
    restart: on-failure
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 30s

networks:
  inception:

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jchartie/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jchartie/data/mariadb

secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt