services:
  nginx:
    build: requirements/nginx
    image: nginx
    ports:
      - "443:443"
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
  wordpress:
    build: requirements/wordpress
    image: wordpress
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
  mariadb:
    build: requirements/mariadb
    image: mariadb
    restart: on-failure
    networks:
      - inception
    secrets:
      - db_password

networks:
  inception:

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/admin/Documents/42/inception/test  #/home/jchartie/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt