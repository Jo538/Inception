services:
  nginx:
    build: requirements/nginx
    image: nginx
    ports:
      - "443:443"
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
  wordpress:
    build: requirements/wordpress
    image: wordpress
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    environment:
      - WP_URL=${WP_URL}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_OTHER_USER=${WP_OTHER_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
  mariadb:
    build: requirements/mariadb
    image: mariadb
    restart: on-failure
    networks:
      - inception
    secrets:
      - db_password

networks:
  inception:

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/admin/Documents/42/inception/test  #/home/jchartie/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt